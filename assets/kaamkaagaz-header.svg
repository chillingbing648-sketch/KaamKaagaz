<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" role="img" aria-label="KaamKaagaz civic-tech paperwork platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf4"/>
      <stop offset="58%" stop-color="#f9f3ea"/>
      <stop offset="100%" stop-color="#efe7dc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d96b2b"/>
      <stop offset="100%" stop-color="#a84416"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#7c4a2d" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1600" height="460" rx="34" fill="url(#bg)"/>
  <circle cx="1430" cy="72" r="140" fill="#d96b2b" opacity=".07"/>
  <circle cx="1510" cy="390" r="180" fill="#0f172a" opacity=".04"/>
  <path d="M0 380 C240 300 390 470 640 386 C870 308 1110 450 1600 308" fill="none" stroke="#d96b2b" stroke-opacity=".09" stroke-width="3"/>

  <g filter="url(#shadow)" transform="translate(90 74)">
    <rect x="0" y="0" width="250" height="310" rx="20" fill="#fff" stroke="#e4ddd3"/>
    <rect x="38" y="48" width="174" height="12" rx="6" fill="#e9e3da"/>
    <rect x="38" y="82" width="132" height="10" rx="5" fill="#f0ebe4"/>
    <rect x="38" y="118" width="160" height="10" rx="5" fill="#f0ebe4"/>
    <rect x="38" y="164" width="174" height="54" rx="12" fill="#fdf5ee" stroke="#f2d6c4"/>
    <path d="M58 190 h78" stroke="#c8561b" stroke-width="8" stroke-linecap="round"/>
    <path d="M58 208 h42" stroke="#c8561b" stroke-width="7" stroke-linecap="round" opacity=".65"/>
    <circle cx="202" cy="268" r="22" fill="url(#accent)"/>
    <path d="M193 268 l7 7 12-15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(390 94)">
    <text x="0" y="32" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#c8561b" letter-spacing="3">CIVIC-TECH / INDIA</text>
    <text x="0" y="92" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="900" fill="#0f172a">KAAMKAAGAZ</text>
    <text x="2" y="145" font-family="Inter, system-ui, sans-serif" font-size="31" font-weight="800" fill="#c8561b">Kaagaz samjho. Kaam karo.</text>
    <text x="2" y="194" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#526071">Paperwork, made simple.</text>

    <g transform="translate(0 242)">
      <rect x="0" y="0" width="174" height="42" rx="21" fill="#0f172a"/>
      <text x="87" y="27" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff">DOCUMENT GUIDES</text>
      <rect x="188" y="0" width="168" height="42" rx="21" fill="#fdf5ee" stroke="#e9cdbb"/>
      <text x="272" y="27" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#a84416">CHECKLISTS</text>
      <rect x="370" y="0" width="164" height="42" rx="21" fill="#fdf5ee" stroke="#e9cdbb"/>
      <text x="452" y="27" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#a84416">3 LANGUAGES</text>
      <rect x="548" y="0" width="196" height="42" rx="21" fill="#fdf5ee" stroke="#e9cdbb"/>
      <text x="646" y="27" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#a84416">OFFICIAL SOURCES</text>
    </g>
